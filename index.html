<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <title>Expediter Counter</title>

  <!-- Lock viewport, no zoom, no double-tap zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- iOS standalone behavior when added to home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Expediter" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Installable app (works when served over https, e.g. GitHub Pages) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />

  <meta name="theme-color" content="#161616" />
  <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

  <!-- Apply saved theme immediately to prevent flash of wrong theme on load -->
  <script>
    (function() {
      try {
        var saved = window.localStorage && window.localStorage.getItem('expediter:theme');
        document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    :root, :root[data-theme="dark"] {
      --bg: #161616;
      --layer-01: #262626;
      --text-primary: #f4f4f4;
      --text-muted: #d4d4d4;
      --interactive: #0f62fe;
      --danger: #da1e28;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --layer-01: #f4f4f4;
      --text-primary: #161616;
      --text-muted: #8d8d8d;
      --interactive: #0f62fe;
      --danger: #da1e28;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      overflow-x: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    /* Carbon-style focus ring: 2px solid blue 60, no offset */
    *:focus-visible {
      outline: 2px solid var(--interactive);
      outline-offset: -2px;
    }
    /* Allow text selection in text inputs */
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
    #root {
      min-height: 100vh;
    }
    /* In fullscreen, scroll inside #root instead of the page. Pulling down at the
       top of the page is Safari's gesture for leaving fullscreen. */
    html.in-fullscreen,
    html.in-fullscreen body {
      height: 100%;
      overflow: hidden;
    }
    html.in-fullscreen #root {
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: var(--bg);
      z-index: 9999;
      padding: 20px;
      text-align: center;
    }
    #boot-loader.hidden {
      display: none;
    }
    #boot-error {
      margin-top: 20px;
      max-width: 90vw;
      color: var(--danger);
      font-size: 11px;
      text-transform: none;
      letter-spacing: 0;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
      background: var(--layer-01);
      padding: 12px;
      border-left: 3px solid var(--danger);
      display: none;
    }
    #boot-error.visible {
      display: block;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" />
  <!-- App styles -->
  <style>

    :root, :root[data-theme="dark"] {
      --bg: #161616;
      --layer-01: #262626;
      --layer-02: #393939;
      --border-strong: #525252;
      --text-muted: #d4d4d4;
      --text-secondary: #ebebeb;
      --text-primary: #f4f4f4;
      --interactive: #0f62fe;
      --interactive-hover: #4589ff;
      --danger: #da1e28;
      --danger-hover: #a2191f;
      --success: #24a148;
      --alert: #f1c21b;
      --shadow: rgba(0, 0, 0, 0.75);
      --course-starter: #4589ff;
      --course-main: #33b1ff;
      --course-dessert: #08bdba;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --layer-01: #f4f4f4;
      --layer-02: #e0e0e0;
      --border-strong: #c6c6c6;
      --text-muted: #8d8d8d;
      --text-secondary: #525252;
      --text-primary: #161616;
      --interactive: #0f62fe;
      --interactive-hover: #0043ce;
      --danger: #da1e28;
      --danger-hover: #750e13;
      --success: #198038;
      --alert: #b28600;
      --shadow: rgba(22, 22, 22, 0.65);
      --course-starter: #0043ce;
      --course-main: #00539a;
      --course-dessert: #005d5d;
    }

    * { box-sizing: border-box; }

    .app {
      min-height: 100vh;
      background: var(--bg);
      background-image: none;
      color: var(--text-primary);
      font-family: 'IBM Plex Mono', monospace;
      /* Keep clear of the notch / status bar when running as an installed app */
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--layer-02);
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 1 280px;
      min-width: 0;
    }

    .event-input {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
      font-size: 32px;
      letter-spacing: 0.08em;
      padding: 0;
      outline: none;
      width: 100%;
      min-width: 0;
      text-overflow: ellipsis;
    }
    .event-input:focus {
      border-bottom: 2px solid var(--interactive);
    }

    .header-sub {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .grand-total {
      text-align: right;
    }
    .grand-total-num {
      font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
      font-size: 40px;
      line-height: 1;
      letter-spacing: 0.04em;
    }
    .grand-total-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .reset-all {
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      padding: 10px 16px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 700;
      transition: all 0.15s;
    }
    .reset-all:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--layer-01);
      border: 1px solid var(--layer-02);
      border-top: 4px solid var(--accent);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .course-name {
      font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
      font-size: 28px;
      letter-spacing: 0.1em;
      color: var(--accent);
    }
    .timer-pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border: 1px solid;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.05em;
    }
    .timer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    .timer-dot-stopped {
      animation: none;
      border-radius: 1px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .remaining-block {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 8px 0;
    }
    .remaining-num {
      font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
      font-size: 88px;
      line-height: 0.85;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .remaining-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .progress-track {
      position: relative;
      height: 8px;
      background: var(--layer-02);
      overflow: hidden;
    }
    .progress-sent {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
    }
    .progress-called {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--accent);
      opacity: 0.4;
      transition: all 0.3s;
    }
    .progress-tickets {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--accent);
      opacity: 0.15;
      transition: all 0.3s;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--layer-02);
    }
    .stat {
      text-align: center;
    }
    .stat-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .stat-value {
      font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
      font-size: 32px;
      line-height: 1;
    }

    .stage {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stage-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pending-badge {
      background: var(--accent);
      color: var(--bg);
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 800;
      font-size: 14px;
      padding: 12px 14px;
      border: 1px solid var(--layer-02);
      background: var(--layer-01);
      color: var(--text-primary);
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.1s;
      flex: 1;
      min-width: 52px;
      text-transform: uppercase;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }
    .btn:hover:not(:disabled) {
      background: var(--layer-02);
      transform: translateY(-1px);
    }
    .btn:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-add:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .order-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .order-field .settings-label {
      margin-bottom: 6px;
    }
    .order-field .num-input-large {
      margin-bottom: 10px;
    }
    .order-presets {
      margin-bottom: 20px;
    }

    .btn-sub {
      flex: 0 0 auto;
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-call {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.1em;
    }
    .btn-call:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }
    .btn-call:disabled {
      background: var(--layer-01);
      color: var(--text-muted);
      border-color: var(--layer-02);
    }

    .btn-send {
      background: var(--layer-01);
    }
    .btn-send:hover:not(:disabled) {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .btn-send-all {
      flex: 0 0 auto;
      background: transparent;
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-send-all:hover:not(:disabled) {
      background: var(--accent);
      color: var(--bg);
    }

    .footer-row {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--layer-02);
    }
    .btn-ghost {
      flex: 1;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
    }
    .btn-reset {
      flex: 0 0 auto;
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border-strong);
      font-size: 11px;
      padding: 12px 18px;
    }
    .btn-reset-full {
      flex: 1;
    }
    .btn-reset:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .remaining-num { font-size: 72px; }
      .event-input { font-size: 24px; min-width: 200px; }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal {
      background: var(--layer-01);
      border: 1px solid var(--layer-02);
      border-top: 4px solid var(--danger);
      padding: 28px;
      max-width: 440px;
      width: calc(100% - 40px);
      animation: slideUp 0.2s ease-out;
      box-sizing: border-box;
      position: relative;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }
    .close-x {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }
    .close-x:hover,
    .close-x:active {
      color: var(--text-primary);
      background: var(--layer-02);
    }
    .modal .modal-title {
      padding-right: 40px;
    }
    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-title {
      font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
      font-size: 26px;
      letter-spacing: 0.08em;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .modal-message {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .modal-btn {
      flex: 0 0 auto;
      padding: 12px 22px;
      font-size: 12px;
    }
    .modal-btn-danger {
      background: var(--danger) !important;
      border-color: var(--danger) !important;
      color: #ffffff !important;
      -webkit-appearance: none;
      appearance: none;
    }
    .modal-btn-danger:hover:not(:disabled),
    .modal-btn-danger:active:not(:disabled),
    .modal-btn-danger:focus:not(:disabled) {
      background: var(--danger-hover) !important;
      border-color: var(--danger-hover) !important;
      color: #ffffff !important;
    }
    .modal-btn-primary {
      background: var(--interactive) !important;
      border-color: var(--interactive) !important;
      color: #ffffff !important;
      -webkit-appearance: none;
      appearance: none;
    }
    .modal-btn-primary:hover:not(:disabled),
    .modal-btn-primary:active:not(:disabled),
    .modal-btn-primary:focus:not(:disabled) {
      background: var(--interactive-hover) !important;
      border-color: var(--interactive-hover) !important;
      color: #ffffff !important;
    }
    .modal-btn-primary:disabled {
      opacity: 0.3;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .icon-btn:hover {
      color: var(--interactive);
      border-color: var(--interactive);
      transform: rotate(45deg);
    }
    .icon-btn-static:hover {
      transform: none;
    }

    .undo-btn {
      background: transparent;
      border: 1px solid var(--interactive);
      color: var(--interactive);
      font-family: 'IBM Plex Mono', monospace;
      padding: 6px 14px;
      min-height: 40px;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 2px;
      max-width: 220px;
      transition: all 0.15s;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }
    .undo-btn:hover:not(:disabled),
    .undo-btn:active:not(:disabled) {
      background: var(--interactive);
      color: #ffffff;
    }
    .undo-btn:disabled {
      border-color: var(--border-strong);
      color: var(--text-muted);
      opacity: 0.5;
      cursor: not-allowed;
    }
    .undo-btn-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .undo-btn-label {
      font-size: 10px;
      letter-spacing: 0.05em;
      opacity: 0.8;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-settings {
      border-top-color: var(--interactive);
      max-width: 480px;
    }
    .settings-section {
      margin-bottom: 20px;
    }
    .settings-label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .toggle-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .toggle-btn {
      background: var(--bg);
      border: 1px solid var(--layer-02);
      color: var(--text-secondary);
      padding: 14px 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      font-family: 'IBM Plex Mono', monospace;
    }
    .toggle-btn:hover {
      border-color: var(--border-strong);
    }
    .toggle-active {
      border-color: var(--interactive) !important;
      background: rgba(15, 98, 254, 0.10);
      color: var(--text-primary);
    }
    .toggle-title {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .toggle-desc {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .toggle-active .toggle-desc {
      color: var(--text-secondary);
    }

    .number-row {
      display: flex;
      gap: 6px;
      align-items: stretch;
      margin-bottom: 10px;
    }
    .num-btn {
      background: var(--layer-01);
      border: 1px solid var(--layer-02);
      color: var(--text-primary);
      padding: 12px 10px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
      font-size: 12px;
      flex: 0 0 auto;
      min-width: 48px;
      transition: all 0.1s;
    }
    .num-btn:hover {
      border-color: var(--interactive);
      color: var(--interactive);
    }
    .num-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--layer-02);
      color: var(--text-primary);
      font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
      font-size: 28px;
      letter-spacing: 0.05em;
      padding: 4px 12px;
      text-align: center;
      outline: none;
      min-width: 0;
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
      max-width: 100%;
    }
    .num-input:focus {

  <div id="root"></div>
  <div id="boot-loader">
    <div>Hleður...</div>
    <div id="boot-error"></div>
  </div>

  <!-- Global error handler — must be first so it catches script load errors -->
  <script>
    function showBootError(msg) {
      var el = document.getElementById('boot-error');
      if (el) {
        el.textContent = String(msg);
        el.classList.add('visible');
      }
    }
    window.addEventListener('error', function(e) {
      showBootError('Villa: ' + (e.message || e.error || 'Óþekkt') +
        (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function(e) {
      showBootError('Promise villa: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
  </script>

  <script src="react.min.js"></script>
  <script src="react-dom.min.js"></script>

  <!-- Sanity check: confirm libraries loaded -->
  <script>
    if (typeof React === 'undefined') showBootError('React.min.js hlaðst ekki — vantar skrá í möppu?');
    else if (typeof ReactDOM === 'undefined') showBootError('react-dom.min.js hlaðst ekki');
  </script>

  <!-- Wake lock + gesture blocking + boot hide -->
  <script>
    try {
      // Prevent pinch-zoom and double-tap zoom on iOS Safari
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); });

      // Double-tap zoom is already off via touch-action: manipulation (CSS).
      // Cancelling quick taps here swallowed fast repeated button presses.
    } catch (e) { /* ignore */ }

    // Try to keep screen awake — wrapped extra-defensively for iOS file://
    var wakeLock = null;
    function requestWakeLock() {
      try {
        if (typeof navigator !== 'undefined' && navigator && 'wakeLock' in navigator) {
          var p = navigator.wakeLock.request('screen');
          if (p && typeof p.then === 'function') {
            p.then(function(lock) {
              wakeLock = lock;
              if (lock && typeof lock.addEventListener === 'function') {
                lock.addEventListener('release', function() { wakeLock = null; });
              }
            }).catch(function() { /* iOS may reject */ });
          }
        }
      } catch (e) { /* older browser or file:// blocked it */ }
    }
    try {
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
      });
      requestWakeLock();
    } catch (e) { /* ignore */ }

    function hideBootLoader() {
      var el = document.getElementById('boot-loader');
      if (el) el.classList.add('hidden');
    }

    // Offline cache for the installed app — only possible over http(s), not file://
    try {
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        navigator.serviceWorker.register('sw.js').catch(function() { /* ignore */ });
      }
    } catch (e) { /* ignore */ }
  </script>


  <script>
    const observer = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        hideBootLoader();
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });
    setTimeout(hideBootLoader, 5000);
  </script>

  <script src="app.js"></script>
